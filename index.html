<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Rule SQL Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <section class="workspace">
      <article class="panel">
        <div class="panel-toolbar">
          <div class="tabs" role="tablist" aria-label="Tipo de script">
            <button class="tab active" type="button" data-mode="rule" role="tab" aria-selected="true">Crear pricing_rule</button>
            <button class="tab" type="button" data-mode="detail" role="tab" aria-selected="false">Crear pricing_rule_detail</button>
          </div>

          <section class="global-settings global-settings-inline" aria-label="Configuracion global">
            <div class="field global-setting-field">
              <label for="globalAuditUserId">AUDIT_USER_ID global *</label>
              <input id="globalAuditUserId" name="globalAuditUserId" type="text" data-bucket="settings" aria-required="true">
            </div>
          </section>
        </div>

        <div class="section-title">
          <div>
            <h2 id="formTitle">Formulario de pricing_rule</h2>
          </div>
          <div class="section-title-meta">
            <div class="detail-controls hidden" id="detailControls" aria-label="Controles de pricing_rule_detail">
              <button class="secondary detail-stepper" type="button" id="removeDetailButton" aria-label="Eliminar pricing_rule_detail">-</button>
              <button class="primary detail-stepper" type="button" id="addDetailButton" aria-label="Agregar pricing_rule_detail">+</button>
            </div>
            <span class="subcopy" id="entityBadge">ENTITY_TYPE_ID 8</span>
          </div>
        </div>

        <form id="generatorForm" novalidate>
          <div class="form-grid" id="fieldGrid"></div>

          <div class="detail-stack hidden" id="detailStack"></div>

          <div class="subpanel" id="auditPanel">
            <h3>Audit log</h3>
            <div class="form-grid" id="auditGrid"></div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Regenerar SQL</button>
            <button class="secondary" type="button" id="restoreDefaultsButton">Restaurar defaults</button>
            <button class="ghost" type="button" id="clearStorageButton">Olvidar últimos valores</button>
          </div>

          <div class="status" id="formStatus" aria-live="polite"></div>
        </form>
      </article>

      <article class="editor-card">
        <div class="editor-heading">
          <div>
            <h2>SQL editable</h2>
          </div>
        </div>

        <div class="editor-meta">
          <span id="editorSummary">Se generará audit_log + pricing_rule.</span>
        </div>

        <textarea id="sqlEditor" spellcheck="false"></textarea>

        <div class="editor-actions">
          <button class="primary" type="button" id="copySqlButton">Copiar SQL</button>
          <button class="secondary" type="button" id="restoreGeneratedButton">Volver al último generado</button>
          <button class="ghost" type="button" id="clearEditorButton">Limpiar editor</button>
        </div>

        <div class="status" id="editorStatus" aria-live="polite"></div>
      </article>
    </section>
  </div>

  <script src="utils.js"></script>
  <script src="config.js"></script>
  <script src="validators.js"></script>
  <script src="sql-generator.js"></script>
  <script src="state-manager.js"></script>
  <script src="form-renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
