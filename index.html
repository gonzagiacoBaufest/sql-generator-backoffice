<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Rule SQL Generator</title>
  <style>
    :root {
      --bg: #ffffff;
      --canvas: #ffffff;
      --canvas-parchment: #f5f5f7;
      --surface-dark: #272729;
      --surface-dark-2: #2a2a2c;
      --ink: #1d1d1f;
      --ink-soft: #333333;
      --muted: #6e6e73;
      --muted-dark: #cccccc;
      --line: #e0e0e0;
      --line-soft: rgba(0, 0, 0, 0.08);
      --accent: #0066cc;
      --accent-focus: #0071e3;
      --accent-on-dark: #2997ff;
      --success: #2f7d4b;
      --warning: #8a5d00;
      --radius-xl: 0px;
      --radius-lg: 18px;
      --radius-md: 11px;
      --radius-sm: 8px;
      --radius-pill: 9999px;
      --input-bg: #b3b3b3;
      --input-bg-dark: #f5f5f7;
      --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      font-family: var(--font-body);
      color: var(--ink);
      background: white;
      line-height: 1.47;
      font-size: 17px;
      letter-spacing: -0.374px;
    }

    .shell {
      width: min(1440px, 100%);
      margin: 44px auto 0;
      padding: 0;
      border-radius: 0;
      overflow: visible;
      background: var(--canvas);
    }

    .panel,
    .editor-card {
      border: 0;
      border-radius: var(--radius-xl);
      padding: 80px clamp(24px, 5vw, 80px);
      min-height: calc(100vh - 44px);
      min-width: 0;
    }

    .helper,
    .pill,
    .field-note,
    .status,
    .subcopy {
      color: var(--muted);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      overflow: visible;
    }

    .panel {
      background: var(--canvas);
    }

    .editor-card {
      background: var(--surface-dark);
      color: #ffffff;
      min-height: auto;
      width: 100%;
      margin: 0;
    }

    .tabs {
      display: inline-flex;
      gap: 8px;
      padding: 4px;
      border-radius: 999px;
      background: var(--canvas-parchment);
      border: 1px solid var(--line-soft);
      margin-bottom: 32px;
    }

    .tab {
      appearance: none;
      border: 0;
      padding: 11px 22px;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease, color 140ms ease;
    }

    .tab:hover,
    .tab:focus-visible {
      color: var(--ink);
      outline: none;
      transform: scale(0.98);
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 32px;
    }

    .section-title h2,
    .editor-heading h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(34px, 4vw, 40px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.28px;
    }

    .form-grid {
      display: grid;
      gap: 16px;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 12px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
    }

    #fieldGrid {
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      align-items: start;
      justify-content: start;
    }

    #auditGrid {
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      align-items: start;
      justify-content: start;
    }

    .field {
      display: grid;
      gap: 6px;
      width: var(--field-width, 120px);
      min-width: var(--field-width, 120px);
      padding: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.12px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--line-soft);
      background: var(--input-bg);
      color: var(--ink);
      min-height: 44px;
      padding: 12px 20px;
      font: inherit;
      font-size: 17px;
      transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }

    input[type="date"],
    input[type="datetime-local"] {
      min-width: 176px;
      padding-right: 14px;
      font-size: 15px;
      letter-spacing: -0.2px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      margin-left: 8px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-focus);
      box-shadow: 0 0 0 2px var(--accent-focus);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.45;
      border-radius: var(--radius-lg);
    }

    .editor-card textarea {
      min-height: 420px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      background: var(--input-bg-dark);
      color: var(--ink);
      padding: 24px;
    }

    .field-note {
      font-size: 12px;
      line-height: 1.3;
      min-height: 32px;
    }

    #fieldGrid::-webkit-scrollbar,
    #auditGrid::-webkit-scrollbar {
      height: 8px;
    }

    #fieldGrid::-webkit-scrollbar-track,
    #auditGrid::-webkit-scrollbar-track {
      background: var(--canvas-parchment);
      border-radius: 999px;
    }

    #fieldGrid::-webkit-scrollbar-thumb,
    #auditGrid::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 999px;
    }

    .subpanel {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .subpanel h3 {
      margin: 0 0 16px;
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 600;
      line-height: 1.19;
      letter-spacing: 0.231px;
    }

    .actions,
    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: var(--radius-pill);
      padding: 11px 22px;
      font: inherit;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: scale(0.95);
      outline: none;
    }

    button:focus-visible,
    .tab:focus-visible {
      box-shadow: 0 0 0 2px var(--accent-focus);
    }

    .primary {
      color: #fff;
      background: var(--accent);
    }

    .secondary {
      color: var(--accent);
      background: transparent;
      border: 1px solid currentColor;
    }

    .ghost {
      color: #ffffff;
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 8px 15px;
      font-size: 14px;
      line-height: 1.29;
      letter-spacing: -0.224px;
    }

    .editor-heading,
    .editor-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .editor-meta {
      margin-bottom: 16px;
      color: var(--muted-dark);
      font-size: 14px;
      line-height: 1.43;
      letter-spacing: -0.224px;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.error {
      color: #b42318;
    }

    .status.success {
      color: var(--success);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1320px) {
      .editor-card {
        background: var(--surface-dark-2);
      }
    }

    @media (max-width: 980px) {
      .panel,
      .editor-card {
        padding: 64px 32px;
        min-height: auto;
      }

      .editor-card textarea {
        min-height: 420px;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: 100%;
        margin-top: 44px;
      }

      .panel,
      .editor-card {
        padding: 48px 20px;
      }

      #fieldGrid,
      #auditGrid {
        grid-auto-columns: minmax(96px, max-content);
      }

      .section-title,
      .editor-heading,
      .editor-meta {
        align-items: flex-start;
        flex-direction: column;
      }

      .section-title h2,
      .editor-heading h2 {
        font-size: 34px;
      }

      .tab,
      button,
      input,
      select,
      textarea {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="workspace">
      <article class="panel">
        <div class="tabs" role="tablist" aria-label="Tipo de script">
          <button class="tab active" type="button" data-mode="rule" role="tab" aria-selected="true">Crear pricing_rule</button>
          <button class="tab" type="button" data-mode="detail" role="tab" aria-selected="false">Crear pricing_rule_detail</button>
        </div>

        <div class="section-title">
          <div>
            <h2 id="formTitle">Formulario de pricing_rule</h2>
          </div>
          <span class="subcopy" id="entityBadge">ENTITY_TYPE_ID 8</span>
        </div>

        <form id="generatorForm" novalidate>
          <div class="form-grid" id="fieldGrid"></div>

          <div class="subpanel">
            <h3>Audit log</h3>
            <div class="form-grid" id="auditGrid"></div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Regenerar SQL</button>
            <button class="secondary" type="button" id="restoreDefaultsButton">Restaurar defaults</button>
            <button class="ghost" type="button" id="clearStorageButton">Olvidar últimos valores</button>
          </div>

          <div class="status" id="formStatus" aria-live="polite"></div>

        </form>
      </article>

      <article class="editor-card">
        <div class="editor-heading">
          <div>
            <h2>SQL editable</h2>
            <div class="helper">Puedes modificar el script generado sin perder el control fino del texto final.</div>
          </div>
        </div>

        <div class="editor-meta">
          <span id="editorSummary">Se generará audit_log + pricing_rule.</span>
          <span id="savedStateLabel">Persistencia local activa</span>
        </div>

        <textarea id="sqlEditor" spellcheck="false"></textarea>

        <div class="editor-actions">
          <button class="primary" type="button" id="copySqlButton">Copiar SQL</button>
          <button class="secondary" type="button" id="restoreGeneratedButton">Volver al último generado</button>
          <button class="ghost" type="button" id="clearEditorButton">Limpiar editor</button>
        </div>

        <div class="status" id="editorStatus" aria-live="polite"></div>
      </article>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "pricing-rule-sql-generator-state-v1";

    const FIELD_SCHEMAS = {
      rule: {
        title: "Formulario de pricing_rule",
        entityTypeId: 8,
        summary: "Se generará audit_log + pricing_rule.",
        fields: [
          { key: "pricingRuleId", label: "PRICING_RULE_ID", required: true, type: "number", note: "ID manual obligatorio.", width: 104 },
          { key: "pricingRuleName", label: "PRICING_RULE_NAME", required: false, type: "text", width: 220 },
          { key: "progressiveType", label: "PROGRESSIVE_TYPE", required: false, type: "text", width: 132 },
          { key: "feeType", label: "FEE_TYPE", required: false, type: "text", width: 96 },
          { key: "totalFeeNumber", label: "TOTAL_FEE_NUMBER", required: false, type: "number", step: "0.01", width: 124 },
          { key: "precedenceType", label: "PRECEDENCE_TYPE", required: false, type: "text", width: 132 },
          { key: "parentPricingRuleId", label: "PARENT_PRICING_RULE_ID", required: false, type: "number", width: 132 },
          { key: "entityVersionId", label: "ENTITY_VERSION_ID", required: false, type: "number", width: 116 },
          { key: "pricingRuleStatusType", label: "PRICING_RULE_STATUS_TYPE", required: false, type: "select", width: 116, options: ["PAA", "APR", "SYC", "REJ", "PAU", "DBU"] },
          { key: "startingDate", label: "STARTING_DATE", required: false, type: "datetime-local", width: 184 },
          { key: "finishDate", label: "FINISH_DATE", required: false, type: "datetime-local", width: 248 },
          { key: "commentsDesc", label: "COMMENTS_DESC", required: false, type: "text", width: 248 },
          { key: "activeType", label: "ACTIVE_TYPE", required: false, type: "number", width: 88 },
          { key: "auditDateRule", label: "AUDIT_DATE", required: true, type: "text", note: "Valor de T_ABKO_PRICING_RULE.AUDIT_DATE.", width: 192 },
          { key: "auditUserIdRule", label: "AUDIT_USER_ID", required: true, type: "text", note: "Valor de T_ABKO_PRICING_RULE.AUDIT_USER_ID.", width: 208 },
          { key: "pricingRuleType", label: "PRICING_RULE_TYPE", required: false, type: "text", width: 208 }
        ]
      },
      detail: {
        title: "Formulario de pricing_rule_detail",
        entityTypeId: 9,
        summary: "Se generará audit_log + pricing_rule_detail.",
        fields: [
          { key: "pricingRuleDetailId", label: "PRICING_RULE_DETAIL_ID", required: true, type: "number", note: "ID manual obligatorio.", width: 126 },
          { key: "pricingRuleId", label: "PRICING_RULE_ID", required: true, type: "number", note: "Debe existir antes de crear el detail.", width: 114 },
          { key: "entityTypeIdDetail", label: "ENTITY_TYPE_ID", required: true, type: "number", width: 104 },
          { key: "objectEntityId", label: "OBJECT_ENTITY_ID", required: false, type: "number", width: 120 },
          { key: "activeTypeDetail", label: "ACTIVE_TYPE", required: false, type: "text", width: 88 },
          { key: "auditDateDetail", label: "AUDIT_DATE", required: true, type: "text", width: 248 },
          { key: "auditUserIdDetail", label: "AUDIT_USER_ID", required: true, type: "text", width: 208 }
        ]
      }
    };

    const AUDIT_FIELDS = [
      { key: "auditLogId", label: "AUDIT_LOG_ID", required: true, type: "number", note: "ID manual obligatorio.", width: 108 },
      { key: "auditDate", label: "AUDIT_DATE", required: true, type: "text", width: 248 },
      { key: "auditUserId", label: "AUDIT_USER_ID", required: true, type: "text", width: 208 },
      { key: "operationType", label: "OPERATION_TYPE", required: true, type: "select", width: 100, options: ["ADD", "DEL", "UPD"] },
      { key: "suboperationName", label: "SUBOPERATION_NAME", required: false, type: "text", width: 148 }
    ];

    const DEFAULT_STATE = {
      mode: "rule",
      forms: {
        rule: {
          pricingRuleId: "",
          pricingRuleName: "",
          progressiveType: "UNIQUE",
          feeType: "PE",
          totalFeeNumber: "",
          precedenceType: "",
          parentPricingRuleId: "",
          entityVersionId: "1",
          pricingRuleStatusType: "PAA",
          startingDate: nextDateTimeLocal(1),
          finishDate: "",
          commentsDesc: "",
          activeType: "1",
          auditDateRule: "SYSDATE",
          auditUserIdRule: "DEVUSER",
          pricingRuleType: "V"
        },
        detail: {
          pricingRuleDetailId: "",
          pricingRuleId: "",
          entityTypeIdDetail: "",
          objectEntityId: "",
          activeTypeDetail: "1",
          auditDateDetail: "SYSDATE",
          auditUserIdDetail: "DEVUSER"
        },
        audit: {
          auditLogId: "",
          auditDate: "SYSDATE",
          auditUserId: "DEVUSER",
          operationType: "ADD",
          suboperationName: ""
        }
      },
      generatedSql: "",
      editorSql: ""
    };

    const state = loadState();
    let lastGeneratedSql = state.generatedSql || "";

    const generatorForm = document.getElementById("generatorForm");
    const fieldGrid = document.getElementById("fieldGrid");
    const auditGrid = document.getElementById("auditGrid");
    const sqlEditor = document.getElementById("sqlEditor");
    const formTitle = document.getElementById("formTitle");
    const entityBadge = document.getElementById("entityBadge");
    const editorSummary = document.getElementById("editorSummary");
    const formStatus = document.getElementById("formStatus");
    const editorStatus = document.getElementById("editorStatus");
    const restoreGeneratedButton = document.getElementById("restoreGeneratedButton");
    const restoreDefaultsButton = document.getElementById("restoreDefaultsButton");
    const clearEditorButton = document.getElementById("clearEditorButton");
    const copySqlButton = document.getElementById("copySqlButton");
    const clearStorageButton = document.getElementById("clearStorageButton");

    render();
    if (!state.editorSql) {
      regenerate();
    } else {
      sqlEditor.value = state.editorSql;
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        state.mode = tab.dataset.mode;
        syncAuditUserId();
        clearStatus();
        render();
        persistState();
      });
    });

    generatorForm.addEventListener("input", handleInputChange);
    generatorForm.addEventListener("submit", (event) => {
      event.preventDefault();
      regenerate();
    });

    sqlEditor.addEventListener("input", () => {
      state.editorSql = sqlEditor.value;
      persistState();
    });

    restoreGeneratedButton.addEventListener("click", () => {
      sqlEditor.value = lastGeneratedSql;
      state.editorSql = lastGeneratedSql;
      persistState();
      setEditorStatus("Editor restaurado al último SQL generado.", "success");
    });

    restoreDefaultsButton.addEventListener("click", () => {
      state.forms[state.mode] = clone(DEFAULT_STATE.forms[state.mode]);
      state.forms.audit = clone(DEFAULT_STATE.forms.audit);
      syncAuditUserId();
      clearStatus();
      render();
      regenerate();
    });

    clearEditorButton.addEventListener("click", () => {
      sqlEditor.value = "";
      state.editorSql = "";
      persistState();
      setEditorStatus("Editor limpio. Puedes pegar o regenerar una query nueva.", "success");
    });

    clearStorageButton.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      Object.assign(state, clone(DEFAULT_STATE));
      syncAuditUserId();
      lastGeneratedSql = "";
      clearStatus();
      render();
      regenerate();
    });

    copySqlButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(sqlEditor.value);
        setEditorStatus("SQL copiado al portapapeles.", "success");
      } catch (error) {
        setEditorStatus("No se pudo copiar automáticamente. Usa Ctrl+C sobre el editor.", "error");
      }
    });

    function render() {
      const schema = FIELD_SCHEMAS[state.mode];
      syncAuditUserId();
      formTitle.textContent = schema.title;
      entityBadge.textContent = "ENTITY_TYPE_ID " + schema.entityTypeId;
      editorSummary.textContent = schema.summary;
      document.querySelectorAll(".tab").forEach((tab) => {
        const isActive = tab.dataset.mode === state.mode;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      });
      renderFields(fieldGrid, schema.fields, state.forms[state.mode]);
      renderFields(auditGrid, AUDIT_FIELDS, state.forms.audit);
      sqlEditor.value = state.editorSql || lastGeneratedSql || "";
    }

    function renderFields(container, fields, values) {
      container.innerHTML = "";
      fields.forEach((field) => {
        const wrapper = document.createElement("div");
        wrapper.className = "field" + (field.full ? " full" : "");
        wrapper.style.setProperty("--field-width", (field.width || 120) + "px");

        const label = document.createElement("label");
        label.setAttribute("for", field.key);
        label.textContent = field.label + (field.required ? " *" : "");

        const input = field.type === "textarea"
          ? document.createElement("textarea")
          : document.createElement(field.type === "select" ? "select" : "input");

        if (input.tagName === "INPUT") {
          input.type = field.type || "text";
          if (field.step) {
            input.step = field.step;
          }
        }

        if (input.tagName === "SELECT") {
          field.options.forEach((optionValue) => {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = optionValue;
            input.appendChild(option);
          });
        }

        input.id = field.key;
        input.name = field.key;
        input.value = values[field.key] ?? "";
        input.placeholder = field.placeholder || "";
        if (field.required) {
          input.setAttribute("aria-required", "true");
        }

        wrapper.append(label, input);

        if (field.note) {
          const note = document.createElement("div");
          note.className = "field-note";
          note.textContent = field.note;
          wrapper.appendChild(note);
        }

        container.appendChild(wrapper);
      });
    }

    function handleInputChange(event) {
      const target = event.target;
      if (!target.name) {
        return;
      }
      const formBucket = findFormBucket(target.name);
      state.forms[formBucket][target.name] = target.value;

      if (target.name === "auditUserIdRule" || target.name === "auditUserIdDetail") {
        state.forms.audit.auditUserId = target.value;
      }

      if (target.name === "auditUserId") {
        state.forms[state.mode][getActiveAuditUserFieldKey()] = target.value;
      }

      if (target.name === "pricingRuleId" && state.mode === "rule") {
        state.forms.audit.objectEntityId = target.value;
      }
      persistState();
    }

    function regenerate() {
      const validation = validateCurrentForm();
      if (!validation.valid) {
        setFormStatus(validation.message, "error");
        return;
      }

      const sql = state.mode === "rule" ? generateRuleSql() : generateDetailSql();
      lastGeneratedSql = sql;
      state.generatedSql = sql;
      state.editorSql = sql;
      sqlEditor.value = sql;
      persistState();
      setFormStatus("SQL regenerado correctamente.", "success");
      setEditorStatus("El editor quedó sincronizado con la última versión generada.", "success");
    }

    function validateCurrentForm() {
      const schema = FIELD_SCHEMAS[state.mode];
      const currentValues = state.forms[state.mode];

      for (const field of schema.fields) {
        if (field.required && isBlank(currentValues[field.key])) {
          return { valid: false, message: "Falta completar " + field.label + "." };
        }
        if (field.type === "number" && !isBlank(currentValues[field.key]) && !isNumeric(currentValues[field.key])) {
          return { valid: false, message: field.label + " debe ser numérico." };
        }
      }

      for (const field of AUDIT_FIELDS) {
        const value = state.forms.audit[field.key];
        if (field.required && isBlank(value)) {
          return { valid: false, message: "Falta completar " + field.label + " del audit_log." };
        }
        if (field.type === "number" && !isBlank(value) && !isNumeric(value)) {
          return { valid: false, message: field.label + " del audit_log debe ser numérico." };
        }
      }

      if (state.mode === "detail" && isBlank(currentValues.pricingRuleId)) {
        return { valid: false, message: "pricing_rule_detail necesita un PRICING_RULE_ID existente." };
      }

      return { valid: true };
    }

    function generateRuleSql() {
      const rule = state.forms.rule;
      const audit = buildAuditPayload("rule");
      return [
        "INSERT INTO T_ABKO_AUDIT_LOG (",
        "  AUDIT_LOG_ID, ENTITY_TYPE_ID, OBJECT_ENTITY_ID, OPERATION_TYPE, SUBOPERATION_NAME, AUDIT_DATE, AUDIT_USER_ID",
        ") VALUES (",
        "  " + sqlValue(audit.auditLogId) + ",",
        "  8,",
        "  " + sqlValue(rule.pricingRuleId) + ",",
        "  " + sqlString(audit.operationType) + ",",
        "  " + sqlNullableString(audit.suboperationName) + ",",
        "  " + sqlTimestamp(audit.auditDate) + ",",
        "  " + sqlString(audit.auditUserId),
        ");",
        "",
        "INSERT INTO T_ABKO_PRICING_RULE (",
        "  PRICING_RULE_ID, PRICING_RULE_NAME, PROGRESSIVE_TYPE, FEE_TYPE, TOTAL_FEE_NUMBER, PRECEDENCE_TYPE,",
        "  PARENT_PRICING_RULE_ID, ENTITY_VERSION_ID, PRICING_RULE_STATUS_TYPE, STARTING_DATE, FINISH_DATE, COMMENTS_DESC,",
        "  ACTIVE_TYPE, AUDIT_LOG_ID, AUDIT_DATE, AUDIT_USER_ID, PRICING_RULE_TYPE",
        ") VALUES (",
        "  " + sqlValue(rule.pricingRuleId) + ",",
        "  " + sqlNullableString(rule.pricingRuleName) + ",",
        "  " + sqlNullableString(rule.progressiveType) + ",",
        "  " + sqlNullableString(rule.feeType) + ",",
        "  " + sqlNullableNumber(rule.totalFeeNumber) + ",",
        "  " + sqlNullableString(rule.precedenceType) + ",",
        "  " + sqlNullableNumber(rule.parentPricingRuleId) + ",",
        "  " + sqlNullableNumber(rule.entityVersionId) + ",",
        "  " + sqlNullableString(rule.pricingRuleStatusType) + ",",
        "  " + sqlNullableTimestamp(rule.startingDate) + ",",
        "  " + sqlNullableTimestamp(rule.finishDate) + ",",
        "  " + sqlNullableString(rule.commentsDesc) + ",",
        "  " + sqlNullableNumber(rule.activeType) + ",",
        "  " + sqlValue(audit.auditLogId) + ",",
        "  " + sqlTimestamp(rule.auditDateRule) + ",",
        "  " + sqlString(rule.auditUserIdRule) + ",",
        "  " + sqlNullableString(rule.pricingRuleType),
        ");"
      ].join("\n");
    }

    function generateDetailSql() {
      const detail = state.forms.detail;
      const audit = buildAuditPayload("detail");
      const objectEntityId = isBlank(detail.objectEntityId) ? detail.pricingRuleDetailId : detail.objectEntityId;
      return [
        "INSERT INTO T_ABKO_AUDIT_LOG (",
        "  AUDIT_LOG_ID, ENTITY_TYPE_ID, OBJECT_ENTITY_ID, OPERATION_TYPE, SUBOPERATION_NAME, AUDIT_DATE, AUDIT_USER_ID",
        ") VALUES (",
        "  " + sqlValue(audit.auditLogId) + ",",
        "  9,",
        "  " + sqlValue(detail.pricingRuleDetailId) + ",",
        "  " + sqlString(audit.operationType) + ",",
        "  " + sqlNullableString(audit.suboperationName) + ",",
        "  " + sqlTimestamp(audit.auditDate) + ",",
        "  " + sqlString(audit.auditUserId),
        ");",
        "",
        "INSERT INTO T_ABKO_PRICING_RULE_DETAIL (",
        "  PRICING_RULE_DETAIL_ID, PRICING_RULE_ID, ENTITY_TYPE_ID, OBJECT_ENTITY_ID, ACTIVE_TYPE, AUDIT_LOG_ID, AUDIT_DATE, AUDIT_USER_ID",
        ") VALUES (",
        "  " + sqlValue(detail.pricingRuleDetailId) + ",",
        "  " + sqlValue(detail.pricingRuleId) + ",",
        "  " + sqlValue(detail.entityTypeIdDetail) + ",",
        "  " + sqlNullableNumber(objectEntityId) + ",",
        "  " + sqlNullableString(detail.activeTypeDetail) + ",",
        "  " + sqlValue(audit.auditLogId) + ",",
        "  " + sqlTimestamp(detail.auditDateDetail) + ",",
        "  " + sqlString(detail.auditUserIdDetail),
        ");"
      ].join("\n");
    }

    function buildAuditPayload(mode) {
      return {
        auditLogId: state.forms.audit.auditLogId,
        auditDate: state.forms.audit.auditDate,
        auditUserId: state.forms[mode][mode === "rule" ? "auditUserIdRule" : "auditUserIdDetail"],
        operationType: state.forms.audit.operationType,
        suboperationName: state.forms.audit.suboperationName,
        entityTypeId: mode === "rule" ? 8 : 9
      };
    }

    function sqlValue(value) {
      return String(value).trim();
    }

    function sqlString(value) {
      return "'" + escapeSql(String(value).trim()) + "'";
    }

    function sqlNullableString(value) {
      return isBlank(value) ? "NULL" : sqlString(value);
    }

    function sqlNullableNumber(value) {
      return isBlank(value) ? "NULL" : String(value).trim();
    }

    function sqlTimestamp(value) {
      if (isOracleSysdate(value)) {
        return "SYSDATE";
      }
      return "TO_TIMESTAMP('" + escapeSql(normalizeDateTime(value)) + "', 'YYYY-MM-DD HH24:MI:SS')";
    }

    function sqlNullableTimestamp(value) {
      return isBlank(value) ? "NULL" : sqlTimestamp(value);
    }

    function normalizeDateTime(value) {
      return String(value).trim().replace("T", " ") + (String(value).trim().length === 10 ? " 00:00:00" : ":00");
    }

    function isOracleSysdate(value) {
      return String(value).trim().toUpperCase() === "SYSDATE";
    }

    function escapeSql(value) {
      return value.replace(/'/g, "''");
    }

    function getActiveAuditUserFieldKey() {
      return state.mode === "rule" ? "auditUserIdRule" : "auditUserIdDetail";
    }

    function syncAuditUserId() {
      state.forms.audit.auditUserId = state.forms[state.mode][getActiveAuditUserFieldKey()];
    }

    function findFormBucket(fieldName) {
      if (AUDIT_FIELDS.some((field) => field.key === fieldName)) {
        return "audit";
      }
      return state.mode;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return clone(DEFAULT_STATE);
        }
        const parsed = JSON.parse(raw);
        return {
          mode: parsed.mode || DEFAULT_STATE.mode,
          forms: {
            rule: { ...clone(DEFAULT_STATE.forms.rule), ...(parsed.forms && parsed.forms.rule ? parsed.forms.rule : {}) },
            detail: { ...clone(DEFAULT_STATE.forms.detail), ...(parsed.forms && parsed.forms.detail ? parsed.forms.detail : {}) },
            audit: { ...clone(DEFAULT_STATE.forms.audit), ...(parsed.forms && parsed.forms.audit ? parsed.forms.audit : {}) }
          },
          generatedSql: parsed.generatedSql || "",
          editorSql: parsed.editorSql || ""
        };
      } catch (error) {
        return clone(DEFAULT_STATE);
      }
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function setFormStatus(message, tone) {
      formStatus.textContent = message;
      formStatus.className = "status " + tone;
    }

    function setEditorStatus(message, tone) {
      editorStatus.textContent = message;
      editorStatus.className = "status " + tone;
    }

    function clearStatus() {
      formStatus.textContent = "";
      formStatus.className = "status";
      editorStatus.textContent = "";
      editorStatus.className = "status";
    }

    function isBlank(value) {
      return value === null || value === undefined || String(value).trim() === "";
    }

    function isNumeric(value) {
      return /^-?\d+(\.\d+)?$/.test(String(value).trim());
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function todayDate() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowDateTimeLocal() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().slice(0, 16);
    }

    function nextDateTimeLocal(daysAhead) {
      const now = new Date();
      const future = new Date(now.getTime() + daysAhead * 24 * 60 * 60 * 1000);
      const offset = future.getTimezoneOffset();
      const local = new Date(future.getTime() - offset * 60000);
      return local.toISOString().slice(0, 16);
    }
  </script>
</body>
